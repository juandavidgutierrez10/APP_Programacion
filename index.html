<script src="config.js"></script>
<script>
/* Registro de unidades y carga del contenido de las unidades NO bloqueadas (ver GUIA_PROFESOR.md). */
window.UNIDADES = {};
window.registrarUnidad = function (u) { window.UNIDADES[u.id] = u; };
(window.CONFIG.unidades || []).forEach(function (u) {
  if (u.estado !== 'bloqueada' && u.archivo) document.write('<script src="' + u.archivo + '"><\/script>');
});
</script>
<script src="js/java-sim.js"></script>
